<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0f0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sage"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><title>Sage Terminal</title><style>:root{--bg:#0a0f0d;--p:#111915;--b:#1e2b24;--g:#39ff88;--r:#ff4d6d;--y:#ffd166;--t:#cfe9dc;--m:#6f8a7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.paper{background:var(--y);color:#000;text-align:center;font-weight:700;letter-spacing:.15em;padding:4px;font-size:11px;position:sticky;top:0;z-index:9}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 6px}header b{color:var(--g);font-size:16px}#live{color:var(--m);font-size:11px}#live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:5px;animation:p 1.6s infinite}@keyframes p{50%{opacity:.25}}
.k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:6px 12px}.c{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px 12px}.c small{color:var(--m);display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.c div{font-size:19px;margin-top:2px}
section{margin:10px 12px;background:var(--p);border:1px solid var(--b);border-radius:12px;padding:10px 12px}h2{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px;display:flex;justify-content:space-between}
.up{color:var(--g)}.dn{color:var(--r)}.y{color:var(--y)}.m{color:var(--m)}canvas{width:100%;height:150px;display:block}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--b)}.row:first-of-type{border-top:0}.row .s{font-weight:700}
.fn{display:flex;flex-direction:column;gap:5px}.bar{height:20px;border-radius:5px;background:#16241d;position:relative;overflow:hidden}.bar span{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#1f7a4a,var(--g));opacity:.55}.bar em{position:relative;padding-left:7px;font-style:normal;font-size:11px;line-height:20px}
.feed{max-height:52vh;overflow:auto}.ev{padding:6px 0;border-top:1px solid var(--b);font-size:12px}.ev .t{color:var(--m);font-size:10px}.tag{display:inline-block;padding:0 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px}
.tabs{display:flex;gap:6px}.tabs button{background:none;border:1px solid var(--b);color:var(--m);border-radius:6px;font:inherit;font-size:10px;padding:2px 7px}.tabs button.a{color:var(--g);border-color:var(--g)}footer{text-align:center;color:var(--m);font-size:10px;padding:14px}footer a{color:var(--m)}</style></head>
<body><div class="paper">PAPER TRADING · SIMULATED · NO REAL MONEY</div>
<header><b>&gt;_ Sage Terminal</b><span id="live"><i></i>connecting…</span></header>
<div class="k"><div class="c"><small>Paper equity</small><div id="eq">–</div></div><div class="c"><small>Total P&amp;L</small><div id="pnl">–</div></div><div class="c"><small>Win rate</small><div id="wr">–</div></div><div class="c"><small>Cash · Fees</small><div id="cash">–</div></div></div>
<section><h2>Equity curve <span id="eqr"></span></h2><canvas id="cv"></canvas></section>
<section><h2>Open positions <span id="opn"></span></h2><div id="pos"></div></section>
<section><h2>Funnel</h2><div class="fn" id="fn"></div><div id="kr" class="m" style="margin-top:8px;font-size:11px"></div></section>
<section><h2>Live feed <span class="tabs"><button data-f="all" class="a">all</button><button data-f="trade">trades</button><button data-f="traded">signals</button><button data-f="killed">kills</button></span></h2><div class="feed" id="feed"></div></section>
<footer>Simulated trades on public market data only. No wallets, keys or real orders. · <a href="/logout">log out</a></footer>
<script>
const $=i=>document.getElementById(i),f2=n=>n==null?'–':(+n).toLocaleString(undefined,{maximumFractionDigits:2}),cl=n=>n>0?'up':n<0?'dn':'m',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let F='all',D=null;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('a'));b.classList.add('a');F=b.dataset.f;feed()});
const TAG={entry:['ENTRY','#39ff88'],exit:['EXIT','#ffd166'],partial_exit:['TP','#ffd166'],killed:['KILL','#ff4d6d'],traded:['SIGNAL→TRADE','#39ff88'],passed_not_traded:['PASS','#8ab4f8'],cycle_error:['ERR','#ff4d6d']};
function feed(){if(!D)return;$('feed').innerHTML=D.feed.filter(e=>F=='all'||(F=='trade'?['entry','exit','partial_exit'].includes(e.kind):e.kind==F)).map(e=>{let d={};try{d=JSON.parse(e.data)}catch(x){}const[t,c]=TAG[e.kind]||[e.kind.toUpperCase(),'#6f8a7c'];
 let msg=e.kind=='entry'?`${esc(d.symbol)} $${f2(d.size)} @ ${(+d.price).toPrecision(4)}`:(e.kind=='exit'||e.kind=='partial_exit')?`${esc(d.symbol)} ${esc(d.reason)}`:`${esc(d.symbol||'')} ${esc(d.reason||(d.tb||'').slice(-120))}`;
 return `<div class="ev"><span class="tag" style="background:${c}22;color:${c}">${t}</span>${msg}<div class="t">${esc(e.ts.replace('T',' '))}</div></div>`}).join('')||'<div class="m">No events yet</div>'}
function chart(pts){const c=$('cv'),r=devicePixelRatio||1,w=c.clientWidth,h=150;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);if(pts.length<2){x.fillStyle='#6f8a7c';x.fillText('collecting data…',8,20);return}
 const step=Math.max(1,Math.floor(pts.length/400)),p=pts.filter((_,i)=>i%step==0||i==pts.length-1),v=p.map(q=>q[1]),lo=Math.min(...v),hi=Math.max(...v),pad=(hi-lo)*.1||1,Y=y=>h-6-(y-lo+pad)/(hi-lo+2*pad)*(h-12),X=i=>i/(p.length-1)*w;
 const up=v[v.length-1]>=v[0],col=up?'#39ff88':'#ff4d6d';const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
 x.beginPath();p.forEach((q,i)=>i?x.lineTo(X(i),Y(q[1])):x.moveTo(0,Y(q[1])));x.strokeStyle=col;x.lineWidth=1.6;x.stroke();x.lineTo(w,h);x.lineTo(0,h);x.fillStyle=g;x.fill();
 $('eqr').textContent=`$${f2(lo)} – $${f2(hi)}`}
async function load(){try{const r=await fetch('/api',{cache:'no-store'});if(r.status==401){location='/login';return}D=await r.json();const s=D.stats;
 $('eq').textContent='$'+f2(s.equity);$('pnl').innerHTML=`<span class="${cl(s.pnl)}">${s.pnl>=0?'+':''}$${f2(s.pnl)}</span>`;
 $('wr').innerHTML=s.win_rate==null?'<span class="m">–</span>':`${(s.win_rate*100).toFixed(0)}% <span class="m" style="font-size:12px">${s.wins}/${s.closed}</span>`;$('cash').innerHTML=`$${f2(s.cash)} <span class="m" style="font-size:12px">· $${f2(s.fees)}</span>`;
 $('opn').textContent=s.open.length;$('pos').innerHTML=s.open.map(p=>`<div class="row"><span><span class="s">${esc(p.symbol)}</span><br><span class="m">entry ${(+p.entry).toPrecision(4)} · ${esc(p.opened.slice(11,16))}</span></span><span class="${cl(p.pnl_pct)}" style="font-size:16px;text-align:right">${p.pnl_pct>0?'+':''}${p.pnl_pct}%<br><span class="m" style="font-size:11px">last ${(+p.last).toPrecision(4)}</span></span></div>`).join('')||'<div class="m">Flat — no open positions</div>';
 const fu=s.funnel,mx=fu.signals||1;$('fn').innerHTML=[['Signals',fu.signals],['Killed',fu.killed||0],['Passed filters',(fu.traded||0)+(fu.passed_not_traded||0)],['Traded',fu.traded||0],['Closed',s.closed],['Wins',s.wins]].map(([k,n])=>`<div class="bar"><span style="width:${Math.max(2,n/mx*100)}%"></span><em>${k} · ${n}</em></div>`).join('');
 $('kr').innerHTML='Top kills: '+s.top_kill_reasons.map(k=>`${esc(k.k)} ×${k.n}`).join(' · ');
 chart(D.equity);feed();$('live').innerHTML='<i></i>live · '+new Date().toLocaleTimeString()}catch(e){$('live').innerHTML='<span class="dn">offline · retrying</span>'}}
load();setInterval(load,10000);document.addEventListener('visibilitychange',()=>!document.hidden&&load());addEventListener('resize',()=>D&&chart(D.equity));
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
